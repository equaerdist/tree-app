version: '3.8'

services:
  app:
    build: .
    container_name: tree-api-app
    ports:
      - 8080:8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
    depends_on:
      - postgres
    networks:
      - app-network

  postgres:
    image: postgres:latest
    container_name: tree-api-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tree_db
    ports:
      - 6543:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:

volumes:
  postgres-data:
